name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Rust + Android (assembleRelease)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust toolchain (targets Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android NDK 27
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core (cdylib para arm64-v8a, armeabi-v7a e x86_64)
        working-directory: rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore (gerada no próprio workflow)
        run: |
          KS="$RUNNER_TEMP/xiso-release.keystore"
          keytool -genkeypair -v \
            -keystore "$KS" \
            -storepass android -keypass android \
            -alias xiso -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=XISO Tool, OU=Dev, O=deivid22srk, L=BR, ST=BR, C=BR"
          echo "XISO_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "XISO_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "XISO_KEY_ALIAS=xiso" >> "$GITHUB_ENV"
          echo "XISO_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build APK (assembleRelease)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XISO-Tool-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: |
            APK release do XISO Tool (arm64-v8a, armeabi-v7a e x86_64).
            Assinado com keystore gerada automaticamente no workflow.
          draft: false
          prerelease: false
